services:
  agent:
    build: .
    container_name: rs_ge_agent
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
    environment:
      - NODE_ENV=production
      - TZ=Asia/Tbilisi
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    stdin_open: true
    tty: true
