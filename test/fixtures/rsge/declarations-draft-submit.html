    <script>
        window.__submitted = false;
        window.__submitClicks = 0;
        const editor = document.getElementById('draft-window');
        const confirmation = document.getElementById('submit-confirmation');
        document.querySelector('[data-action="submit-declaration"]').addEventListener('click', () => {
            window.__submitClicks += 1;
            confirmation.style.display = 'block';
        });
        document.querySelector('[data-action="confirm-submit"]').addEventListener('click', () => {
            window.__submitted = true;
            document.getElementById('declaration-status').textContent = 'გადაგზავნილი';
            document.querySelector('#declaration-row td:nth-child(6)').textContent = '19.11.2026 12:05';
            editor.style.display = 'none';
            confirmation.style.display = 'none';
        });
    </script>
