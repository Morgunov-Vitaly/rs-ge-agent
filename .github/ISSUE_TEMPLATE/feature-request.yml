name: Feature request
description: Propose a new RS.GE workflow or product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the user need rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Expected action risk
      options:
        - READ_ONLY
        - DRAFT_WRITE
        - IRREVERSIBLE
        - EXTERNAL_PAYMENT
        - Not sure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Official source or portal evidence
      description: Link an official rule or describe sanitized portal behavior when applicable.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This request contains no credentials, personal data or real financial references.
          required: true
