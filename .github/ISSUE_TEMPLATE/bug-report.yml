name: Bug report
description: Report reproducible incorrect or unsafe behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include taxpayer IDs, credentials, SMS codes, cookies, bank references, declarations or screenshots containing personal data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Telegram workflow
        - RS.GE browser connector
        - Google Sheets connector
        - Tax calculation
        - Payment reconciliation
        - Documentation or setup
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior using sanitized data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the command and sanitized input, but no secrets or taxpayer data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all credentials, personal data and real financial references.
          required: true
